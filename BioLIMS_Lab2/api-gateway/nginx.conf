events {
    worker_connections 1024;
}

http {
    # Встроенный DNS Docker для динамического обнаружения реплик при масштабировании
    resolver 127.0.0.11 valid=1s ipv6=off;

    server {
        listen 8080;

        # Маршрутизация к Order & Sample Service
        location /api/orders {
            set $order_upstream http://order-sample-service:8001;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $order_upstream;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Маршрутизация к Assay Execution Service
        location /api/assays {
            set $assay_upstream http://assay-execution-service:8002;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $assay_upstream;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # Маршрутизация к Validation & Report Service
        location /api/reports {
            set $report_upstream http://validation-report-service:8003;
            rewrite ^/api/(.*) /$1 break;
            proxy_pass $report_upstream;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }
    }
}